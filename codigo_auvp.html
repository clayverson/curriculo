<script id="app-id" type="text/plain">orcamentodomestico-bdc7b</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Read config
    let firebaseConfig = {};
    let appId = 'default-app-id';
    try{ firebaseConfig = JSON.parse(document.getElementById('firebase-config').textContent); appId = document.getElementById('app-id').textContent; } catch(e){ console.error('Erro ao parsear configuração do Firebase', e); }

    // Safety: if opened via file:// warn user
    if(window.location.protocol === 'file:'){
        alert('⚠️ Execute o projeto via servidor local (Live Server). Login com Google e Firestore não funcionam via file://');
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Expose firestore functions to non-module scripts
    window.firebaseFirestore = { doc, getDoc, setDoc, collection, onSnapshot, query, orderBy };
    window.firebaseAuth = { getAuth: () => auth, updateProfile };

    // DOM elements
    const loginPage = document.getElementById('login-page');
    const dashboardPage = document.getElementById('dashboard-page');
    const btnLogout = document.getElementById('btn-logout');
    const btnLogin = document.getElementById('btn-login');
    const btnCreateAccount = document.getElementById('btn-create-account');
    const btnGoogleLogin = document.getElementById('btn-google-login');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginErrorMessage = document.getElementById('login-error-message');
    const userDisplayName = document.getElementById('user-display-name');
    const userDisplayAvatar = document.getElementById('user-display-avatar');

    // BRAPI settings
    const BRAPI_TOKEN = '8eZPTTApn1MQmbFDQZtzVw';
    const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes
    const MIN_DELAY = 900; // ms between requests (slightly under 1s safe)

    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function fetchWithDelay(url){
        // ensure minimum delay between calls
        if(!window._lastFetchTime) window._lastFetchTime = 0;
        const now = Date.now();
        const since = now - window._lastFetchTime;
        if(since < MIN_DELAY) await sleep(MIN_DELAY - since);
        window._lastFetchTime = Date.now();

        const res = await fetch(url);
        if(!res.ok) throw new Error('Erro HTTP: ' + res.status);
        return res.json();
    }

    async function fetchBrapi(endpoint, params = ''){
        const endpointKey = endpoint + (params? '_' + params : '');
        const cacheKey = 'brapi_' + endpointKey;
        try{
            const cached = localStorage.getItem(cacheKey);
            if(cached){
                const parsed = JSON.parse(cached);
                if(Date.now() - parsed.t < CACHE_DURATION){
                    console.log('🔁 BRAPI cache hit:', endpoint);
                    return parsed.v;
                }
            }
        }catch(e){ console.warn('BRAPI cache read failed', e); }

        const url = `https://brapi.dev/api/${endpoint}${params ? '&' + params : ''}?token=${BRAPI_TOKEN}`.replace('?&','?');
        try{
            const data = await fetchWithDelay(url);
            try{ localStorage.setItem(cacheKey, JSON.stringify({ v:data, t:Date.now() })); } catch(e){ console.warn('Não foi possível gravar cache BRAPI', e); }
            return data;
        }catch(err){
            console.warn('BRAPI request failed', err);
            // fallback to cache if available
            const cached = localStorage.getItem(cacheKey);
            if(cached) return JSON.parse(cached).v;
            throw err;
        }
    }

    // Auth handlers
    btnLogin.addEventListener('click', async ()=>{
        const email = loginEmail.value; const password = loginPassword.value;
        if(!email || !password){ loginErrorMessage.textContent = 'Preencha e-mail e senha.'; return; }
        try{ loginErrorMessage.textContent=''; await signInWithEmailAndPassword(auth, email, password); }
        catch(err){ console.error('Erro ao entrar', err); loginErrorMessage.textContent = 'E-mail ou senha inválidos.'; }
    });

    btnCreateAccount.addEventListener('click', async ()=>{
        const email = loginEmail.value; const password = loginPassword.value;
        if(!email || !password){ loginErrorMessage.textContent = 'Preencha e-mail e senha.'; return; }
        if(password.length < 6){ loginErrorMessage.textContent = 'Senha deve ter ao menos 6 caracteres.'; return; }
        try{ loginErrorMessage.textContent=''; await createUserWithEmailAndPassword(auth, email, password); }
        catch(err){ console.error('Erro criar conta', err); loginErrorMessage.textContent = (err.code==='auth/email-already-in-use')? 'E-mail já em uso.': 'Erro ao criar conta.'; }
    });

    btnGoogleLogin.addEventListener('click', async ()=>{
        const provider = new GoogleAuthProvider();
        try{ loginErrorMessage.textContent=''; await signInWithPopup(auth, provider); }
        catch(err){ console.error('Erro login Google', err); if(err.code==='auth/unauthorized-domain') loginErrorMessage.textContent = 'Domínio não autorizado. Use Live Server e adicione localhost no Authorized Domains do Firebase.'; else loginErrorMessage.textContent='Falha ao logar com Google.'; }
    });

    btnLogout.addEventListener('click', async ()=>{ try{ await signOut(auth); } catch(e){ console.error('Erro logout', e); } });

    onAuthStateChanged(auth, user =>{
        if(user){
            loginPage.classList.add('hidden'); dashboardPage.classList.remove('hidden');
            const displayName = user.displayName || (user.email? user.email.split('@')[0]: 'Usuário');
            userDisplayName.textContent = `Olá, ${displayName}`;
            userDisplayAvatar.src = user.photoURL || `https://placehold.co/40x40/EAB308/1F2937?text=${displayName.charAt(0).toUpperCase()}`;
            window.initDashboard && window.initDashboard(user, appId, db);
        } else {
            dashboardPage.classList.add('hidden'); loginPage.classList.remove('hidden');
        }
    });

    // Expose BRAPI helper globally for dashboard code
    window.BRAPI = { fetchBrapi };

</script>

<!-- Dashboard logic (non-module code can use window.firebaseFirestore and window.BRAPI) -->
<script>
// Simple page router (nav links)
document.querySelectorAll('.nav-link').forEach(a=>{
    a.addEventListener('click', (e)=>{
        e.preventDefault(); const page = a.dataset.page; if(!page) return;
        document.querySelectorAll('.page-content').forEach(p=>p.classList.add('hidden'));
        const show = document.getElementById('page-'+page) || document.getElementById('page-'+page.replace(' ','-'));
        if(show) show.classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('bg-gray-800'));
        a.classList.add('bg-gray-800');
    });
});

// Minimal initDashboard - loads sample BRAPI data and handles errors gracefully
window.initDashboard = async (user, appId, db) => {
    try{
        console.log('Inicializando dashboard para', user.uid);
        // Test connection quick read
        try{
            const testDoc = window.firebaseFirestore.doc(db, 'meta', 'version');
            await window.firebaseFirestore.getDoc(testDoc);
            console.log('✅ Firestore OK');
        }catch(e){ console.warn('Firestore test read failed', e); }

        // Load BRAPI sample and render basic list into carteira page
        const acoesContainer = document.getElementById('page-acoes-br');
        try{
            const res = await window.BRAPI.fetchBrapi('quote/list');
            const stocks = res.stocks || res.results || [];
            const p = document.createElement('div'); p.className='bg-gray-900 p-4 rounded mt-4';
            p.innerHTML = `<strong>Exemplo cotações:</strong> ${stocks.slice(0,5).map(s=>s?.stock || s?.symbol || s?.ticker || JSON.stringify(s)).join(', ')}`;
            acoesContainer.appendChild(p);
        }catch(e){
            const p = document.createElement('div'); p.className='text-red-400 mt-4'; p.textContent = 'Falha ao carregar cotações da BRAPI: ' + (e.message||e);
            acoesContainer.appendChild(p);
        }

    }catch(e){ console.error('Erro initDashboard', e); }
};
</script>
