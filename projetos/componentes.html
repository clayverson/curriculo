<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Técnico de Eletrônica Pro V2.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab {
            border-left: 4px solid #3b82f6;
            background-color: #f0f7ff;
            font-weight: bold;
            color: #1e40af;
        }
        .probe-red { color: #ef4444; font-weight: bold; }
        .probe-black { color: #1f2937; font-weight: bold; }
        svg { max-width: 100%; height: auto; display: block; margin: auto; }
        
        .bg-preto { background-color: #000; }
        .bg-marrom { background-color: #8b4513; }
        .bg-vermelho { background-color: #ff0000; }
        .bg-laranja { background-color: #ffa500; }
        .bg-amarelo { background-color: #ffff00; }
        .bg-verde { background-color: #008000; }
        .bg-azul { background-color: #0000ff; }
        .bg-violeta { background-color: #ee82ee; }
        .bg-cinza { background-color: #808080; }
        .bg-branco { background-color: #ffffff; border: 1px solid #ccc; }
        .bg-ouro { background-color: #ffd700; }
        .bg-prata { background-color: #c0c0c0; }

        .multimeter-red { fill: #ef4444; stroke: #b91c1c; stroke-width: 1.5; }
        .multimeter-black { fill: #1f2937; stroke: #000; stroke-width: 1.5; }
        
        .pulse-wave { stroke-dasharray: 5; animation: dash 3s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -20; } }

        .rectified-wave {
            stroke: #ef4444;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 4s ease-in-out infinite;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div class="max-w-7xl mx-auto p-4">
        <header class="bg-slate-900 text-white p-6 rounded-t-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center border-b-4 border-blue-500">
            <div>
                <h1 class="text-3xl font-black text-blue-400 tracking-tight italic">MASTER BANCADA V2.6</h1>
                <p class="opacity-70 text-sm">Guia Avançado de Diagnóstico e Medição</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <div class="bg-slate-800 px-4 py-2 rounded-lg border border-red-600 shadow-lg">
                    <span class="text-red-500 font-bold text-xs uppercase">🔴 POSITIVO (V/Ω)</span>
                </div>
                <div class="bg-slate-800 px-4 py-2 rounded-lg border border-gray-600 shadow-lg">
                    <span class="text-gray-400 font-bold text-xs uppercase">⚫ NEGATIVO (COM)</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- Navegação Lateral -->
            <aside class="bg-white p-5 rounded-2xl shadow-sm h-fit sticky top-4 border border-gray-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase mb-4 px-2 tracking-widest">COMPONENTES</p>
                <nav class="space-y-1">
                    <button onclick="showComp('transistor')" id="btn-transistor" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Transistor BJT (NPN/PNP)</button>
                    <button onclick="showComp('ponte')" id="btn-ponte" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Ponte Retificadora</button>
                    <button onclick="showComp('mosfet')" id="btn-mosfet" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Transistor MOSFET</button>
                    <button onclick="showComp('regulador')" id="btn-regulador" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Reguladores (Série 78xx)</button>
                    <button onclick="showComp('cipwm')" id="btn-cipwm" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">CI PWM (8 Pinos)</button>
                    <button onclick="showComp('opto')" id="btn-opto" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Fotoacoplador</button>
                    <button onclick="showComp('diododuplo')" id="btn-diododuplo" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Diodo Duplo</button>
                    <button onclick="showComp('diodo')" id="btn-diodo" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Diodo Simples</button>
                    <button onclick="showComp('capacitor')" id="btn-capacitor" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Capacitor Eletrolítico</button>
                    <button onclick="showComp('resistor')" id="btn-resistor" class="w-full text-left p-3 rounded-xl hover:bg-gray-50 transition text-sm">Calculadora de Resistores</button>
                </nav>
            </aside>

            <!-- Área Principal -->
            <main class="md:col-span-3">
                <div id="content" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 min-h-[650px]">
                    <!-- Injetado dinamicamente -->
                </div>
            </main>
        </div>
    </div>

    <script>
        const components = {
            transistor: {
                title: "Transistores BJT (NPN e PNP)",
                flow: "O transistor controla a corrente principal através de uma pequena corrente na Base. No <b>NPN</b>, a corrente flui do Coletor para o Emissor. No <b>PNP</b>, ela flui do Emissor para o Coletor.",
                measurement: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                            <h4 class="font-bold text-blue-800 text-sm mb-2">Teste NPN</h4>
                            <ul class="text-xs space-y-1 text-blue-900">
                                <li>1. <span class="probe-red">Vermelha</span> na Base.</li>
                                <li>2. <span class="probe-black">Preta</span> no Coletor e Emissor.</li>
                                <li>3. Leitura: ~0.600V.</li>
                            </ul>
                        </div>
                        <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                            <h4 class="font-bold text-red-800 text-sm mb-2">Teste PNP</h4>
                            <ul class="text-xs space-y-1 text-red-900">
                                <li>1. <span class="probe-black">Preta</span> na Base.</li>
                                <li>2. <span class="probe-red">Vermelha</span> no Coletor e Emissor.</li>
                                <li>3. Leitura: ~0.600V.</li>
                            </ul>
                        </div>
                    </div>
                `,
                svg: `
                <svg viewBox="0 0 400 180">
                    <g transform="translate(40, 20)">
                        <rect width="120" height="90" fill="#333" rx="8"/>
                        <line x1="30" y1="90" x2="30" y2="130" stroke="#333" stroke-width="4"/>
                        <line x1="60" y1="90" x2="60" y2="130" stroke="#333" stroke-width="4"/>
                        <line x1="90" y1="90" x2="90" y2="130" stroke="#333" stroke-width="4"/>
                        <text x="60" y="55" fill="white" font-weight="bold" text-anchor="middle">NPN</text>
                        <text x="30" y="145" font-size="10" text-anchor="middle">C</text>
                        <text x="60" y="145" font-size="10" text-anchor="middle">B</text>
                        <text x="90" y="145" font-size="10" text-anchor="middle">E</text>
                        <circle cx="60" cy="120" r="10" class="multimeter-red"/>
                    </g>
                    <g transform="translate(240, 20)">
                        <rect width="120" height="90" fill="#333" rx="8"/>
                        <line x1="30" y1="90" x2="30" y2="130" stroke="#333" stroke-width="4"/>
                        <line x1="60" y1="90" x2="60" y2="130" stroke="#333" stroke-width="4"/>
                        <line x1="90" y1="90" x2="90" y2="130" stroke="#333" stroke-width="4"/>
                        <text x="60" y="55" fill="white" font-weight="bold" text-anchor="middle">PNP</text>
                        <text x="30" y="145" font-size="10" text-anchor="middle">E</text>
                        <text x="60" y="145" font-size="10" text-anchor="middle">B</text>
                        <text x="90" y="145" font-size="10" text-anchor="middle">C</text>
                        <circle cx="60" cy="120" r="10" class="multimeter-black"/>
                    </g>
                </svg>`
            },
            ponte: {
                title: "Ponte Retificadora (Fluxo AC -> DC)",
                flow: "A ponte retificadora 'pega' a Corrente Alternada (AC) que oscila e a transforma em Corrente Contínua (DC) Pulsante. Observe como os 4 diodos agem como válvulas direcionais.",
                measurement: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div class="p-3 bg-gray-50 border rounded-lg text-xs leading-relaxed">
                            <h5 class="font-bold mb-1">Passo 1: Teste de Saída (-)</h5>
                            Ponta <span class="probe-red">Vermelha</span> no pino <b>(-)</b>.<br>
                            Ponta <span class="probe-black">Preta</span> em cada pino <b>(~)</b>.<br>
                            Deve marcar condução (0.5V a 0.7V).
                        </div>
                        <div class="p-3 bg-gray-50 border rounded-lg text-xs leading-relaxed">
                            <h5 class="font-bold mb-1">Passo 2: Teste de Saída (+)</h5>
                            Ponta <span class="probe-black">Preta</span> no pino <b>(+)</b>.<br>
                            Ponta <span class="probe-red">Vermelha</span> em cada pino <b>(~)</b>.<br>
                            Deve marcar condução (0.5V a 0.7V).
                        </div>
                    </div>
                `,
                svg: `
                <svg viewBox="0 0 500 280">
                    <!-- Vista do Componente Físico -->
                    <g transform="translate(20, 40)">
                        <rect width="140" height="100" fill="#222" rx="6"/>
                        <text x="70" y="30" fill="white" font-weight="bold" font-size="12" text-anchor="middle">PONTE KBU</text>
                        
                        <line x1="30" y1="100" x2="30" y2="150" stroke="#333" stroke-width="4"/><text x="30" y="165" font-size="12" font-weight="bold" text-anchor="middle">+</text>
                        <line x1="57" y1="100" x2="57" y2="150" stroke="#333" stroke-width="4"/><text x="57" y="165" font-size="12" font-weight="bold" text-anchor="middle">~</text>
                        <line x1="83" y1="100" x2="83" y2="150" stroke="#333" stroke-width="4"/><text x="83" y="165" font-size="12" font-weight="bold" text-anchor="middle">~</text>
                        <line x1="110" y1="100" x2="110" y2="150" stroke="#333" stroke-width="4"/><text x="110" y="165" font-size="12" font-weight="bold" text-anchor="middle">-</text>
                        
                        <circle cx="110" cy="150" r="12" class="multimeter-red"/>
                    </g>

                    <!-- Esquema Interno Detalhado -->
                    <g transform="translate(280, 100)">
                        <path d="M0 -70 L70 0 L0 70 L-70 0 Z" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5"/>
                        
                        <!-- Diodos (4 un) -->
                        <g transform="translate(-35, -35) rotate(-45)"><path d="M-15 0 L15 0 M0 -10 L0 10 M-8 -8 L-8 8" stroke="#333" stroke-width="2.5"/></g>
                        <g transform="translate(35, -35) rotate(45)"><path d="M-15 0 L15 0 M0 -10 L0 10 M-8 -8 L-8 8" stroke="#333" stroke-width="2.5"/></g>
                        <g transform="translate(-35, 35) rotate(-135)"><path d="M-15 0 L15 0 M0 -10 L0 10 M-8 -8 L-8 8" stroke="#333" stroke-width="2.5"/></g>
                        <g transform="translate(35, 35) rotate(135)"><path d="M-15 0 L15 0 M0 -10 L0 10 M-8 -8 L-8 8" stroke="#333" stroke-width="2.5"/></g>
                        
                        <!-- Terminais do Esquema -->
                        <circle cx="0" cy="-70" r="6" fill="#ef4444"/><text y="-80" text-anchor="middle" font-weight="bold" font-size="12" fill="#ef4444">(+) DC</text>
                        <circle cx="0" cy="70" r="6" fill="#1f2937"/><text y="85" text-anchor="middle" font-weight="bold" font-size="12" fill="#1f2937">(-) DC</text>
                        <circle cx="-70" cy="0" r="6" fill="#3b82f6"/><text x="-80" y="5" text-anchor="end" font-weight="bold" font-size="12" fill="#3b82f6">~ AC</text>
                        <circle cx="70" cy="0" r="6" fill="#3b82f6"/><text x="80" y="5" text-anchor="start" font-weight="bold" font-size="12" fill="#3b82f6">~ AC</text>
                        
                        <circle cx="-70" cy="0" r="12" class="multimeter-black"/>
                    </g>

                    <!-- Gráfico de Retificação -->
                    <g transform="translate(20, 210)">
                        <path d="M0 40 Q 25 -10 50 40 Q 75 90 100 40" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.4"/>
                        <text x="0" y="60" font-size="10" fill="#3b82f6">Onda AC (Entrada)</text>
                        
                        <path d="M150 40 Q 175 -10 200 40 Q 225 -10 250 40" class="rectified-wave" />
                        <text x="150" y="60" font-size="10" fill="#ef4444">Onda DC (Retificada)</text>
                    </g>
                </svg>`
            },
            mosfet: {
                title: "Transistor MOSFET (Chave de Potência)",
                flow: "O MOSFET funciona por campo elétrico. Tensão no Gate (G) permite a passagem de corrente entre Dreno (D) e Source (S).",
                measurement: "Escala de Diodo: <span class=\"probe-red\">Vermelha</span> no Source e <span class=\"probe-black\">Preta</span> no Dreno. Deve marcar o diodo interno (~0.5V). Gate deve ser isolado.",
                svg: `<svg viewBox="0 0 240 180"><rect x="80" y="30" width="80" height="90" fill="#333"/><line x1="95" y1="120" x2="95" y2="160" stroke="#333" stroke-width="4"/><line x1="120" y1="120" x2="120" y2="160" stroke="#333" stroke-width="4"/><line x1="145" y1="120" x2="145" y2="160" stroke="#333" stroke-width="4"/><text x="95" y="175" font-size="10" text-anchor="middle">G</text><text x="120" y="175" font-size="10" text-anchor="middle">D</text><text x="145" y="175" font-size="10" text-anchor="middle">S</text><circle cx="145" cy="145" r="10" class="multimeter-red"/><circle cx="120" cy="135" r="10" class="multimeter-black"/></svg>`
            },
            regulador: {
                title: "Reguladores de Energia (Série 78xx)",
                flow: "Estabiliza a tensão. Se entra 12V e é um 7805, a saída será sempre 5V cravados.",
                measurement: "Escala DCV: <span class=\"probe-black\">Preta</span> no pino central (GND). <span class=\"probe-red\">Vermelha</span> na saída (pino 3).",
                svg: `
                <svg viewBox="0 0 240 180">
                    <rect x="80" y="20" width="80" height="90" fill="#444"/>
                    <rect x="80" y="5" width="80" height="15" fill="#777"/>
                    <line x1="95" y1="110" x2="95" y2="150" stroke="#444" stroke-width="4"/><text x="95" y="165" font-size="8" text-anchor="middle">IN</text>
                    <line x1="120" y1="110" x2="120" y2="150" stroke="#444" stroke-width="4"/><text x="120" y="165" font-size="8" text-anchor="middle">GND</text>
                    <line x1="145" y1="110" x2="145" y2="150" stroke="#444" stroke-width="4"/><text x="145" y="165" font-size="8" text-anchor="middle">OUT</text>
                    <circle cx="120" cy="135" r="10" class="multimeter-black"/>
                    <circle cx="145" cy="135" r="10" class="multimeter-red"/>
                </svg>`
            },
            cipwm: {
                title: "CI PWM (Controlador de Pulso)",
                flow: "Gera a oscilação necessária para fontes chaveadas. Controla o tempo de 'liga/desliga' do MOSFET.",
                measurement: "Escala Ohm: Meça curto entre Pino 5 (GND) e Pino 7 (VCC). Bipar indica falha.",
                svg: `<svg viewBox="0 0 240 180"><rect x="70" y="40" width="100" height="100" fill="#333" rx="5"/><circle cx="85" cy="55" r="4" fill="#666"/><rect x="45" y="52" width="25" height="4" fill="#aaa"/><rect x="45" y="77" width="25" height="4" fill="#aaa"/><rect x="45" y="102" width="25" height="4" fill="#aaa"/><rect x="45" y="127" width="25" height="4" fill="#aaa"/><rect x="170" y="127" width="25" height="4" fill="#aaa"/><rect x="170" y="102" width="25" height="4" fill="#aaa"/><rect x="170" y="77" width="25" height="4" fill="#aaa"/><rect x="170" y="52" width="25" height="4" fill="#aaa"/><circle cx="180" cy="80" r="10" class="multimeter-red"/><circle cx="180" cy="130" r="10" class="multimeter-black"/></svg>`
            },
            opto: {
                title: "Fotoacoplador (Isolador Óptico)",
                flow: "Transmite sinal via luz. Isola totalmente a parte de alta tensão da parte de baixa tensão.",
                measurement: "Pinos 1-2: Comportam-se como um diodo. Pinos 3-4: Isolados (aberto) em repouso.",
                svg: `<svg viewBox="0 0 240 160"><rect x="90" y="40" width="60" height="80" fill="#333" rx="4"/><circle cx="102" cy="52" r="3" fill="#666"/><rect x="70" y="55" width="20" height="4" fill="#888"/><rect x="70" y="100" width="20" height="4" fill="#888"/><rect x="150" y="100" width="20" height="4" fill="#888"/><rect x="150" y="55" width="20" height="4" fill="#888"/><circle cx="80" cy="55" r="10" class="multimeter-red"/><circle cx="80" cy="100" r="10" class="multimeter-black"/></svg>`
            },
            diododuplo: {
                title: "Diodo Duplo (Catodo Comum)",
                flow: "Dois diodos que compartilham a saída central. Muito usado em saídas de fontes de PC.",
                measurement: "Ponta <span class=\"probe-black\">Preta</span> no centro, <span class=\"probe-red\">Vermelha</span> nas extremidades. Deve conduzir.",
                svg: `
                <svg viewBox="0 0 240 180">
                    <rect x="80" y="30" width="80" height="80" fill="#333"/>
                    <line x1="95" y1="110" x2="95" y2="150" stroke="#333" stroke-width="4"/>
                    <line x1="120" y1="110" x2="120" y2="150" stroke="#333" stroke-width="4"/>
                    <line x1="145" y1="110" x2="145" y2="150" stroke="#333" stroke-width="4"/>
                    <path d="M100 80 L115 80 M115 70 L115 90" stroke="white" stroke-width="2"/>
                    <path d="M140 80 L125 80 M125 70 L125 90" stroke="white" stroke-width="2"/>
                    <circle cx="120" cy="135" r="10" class="multimeter-black"/>
                    <circle cx="95" cy="135" r="10" class="multimeter-red"/>
                </svg>`
            },
            diodo: {
                title: "Diodo Retificador Simples",
                flow: "Válvula de mão única. Corrente só passa se entrar pelo lado sem a faixa cinza.",
                measurement: "Ponta <span class=\"probe-red\">Vermelha</span> no Anodo, <span class=\"probe-black\">Preta</span> na faixa cinza (Catodo).",
                svg: `
                <svg viewBox="0 0 240 100">
                    <rect x="60" y="40" width="120" height="24" fill="#222" rx="3"/>
                    <rect x="155" y="40" width="10" height="24" fill="#aaa"/>
                    <line x1="30" y1="52" x2="60" y2="52" stroke="#333" stroke-width="2"/>
                    <line x1="180" y1="52" x2="210" y2="52" stroke="#333" stroke-width="2"/>
                    <circle cx="45" cy="52" r="10" class="multimeter-red"/>
                    <circle cx="195" cy="52" r="10" class="multimeter-black"/>
                </svg>`
            },
            capacitor: {
                title: "Capacitor Eletrolítico",
                flow: "Filtra e armazena energia. A faixa cinza indica o lado Negativo (-).",
                measurement: "Escala Ohm: Valor deve subir gradualmente até atingir OL (infinito).",
                svg: `<svg viewBox="0 0 240 160"><rect x="100" y="30" width="40" height="80" fill="#2563eb" rx="2"/><rect x="125" y="30" width="10" height="80" fill="#cbd5e1"/><circle cx="110" cy="130" r="10" class="multimeter-red"/><circle cx="130" cy="130" r="10" class="multimeter-black"/></svg>`
            },
            resistor: {
                title: "Calculadora de Resistores Profissional",
                flow: "Controla a intensidade da corrente limitando sua passagem.",
                isInteractive: true
            }
        };

        function showComp(id) {
            const comp = components[id];
            if (!comp) return;

            const content = document.getElementById('content');
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-tab'));
            const activeBtn = document.getElementById('btn-' + id);
            if (activeBtn) activeBtn.classList.add('active-tab');

            if (comp.isInteractive) {
                content.innerHTML = `<h2 class="text-2xl font-bold text-blue-800 mb-6 border-b-2 border-blue-100 pb-2">${comp.title}</h2><div id="resistor-app"></div>`;
                renderResistorCalc();
            } else {
                content.innerHTML = `
                    <h2 class="text-2xl font-bold text-blue-800 mb-6 border-b-2 border-blue-100 pb-2">${comp.title}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col items-center overflow-hidden">
                            <span class="text-[9px] font-bold text-gray-400 uppercase mb-3">Guia Visual e Fluxo</span>
                            ${comp.svg}
                        </div>
                        <div class="flex flex-col justify-center">
                            <h3 class="text-sm font-bold text-gray-400 uppercase mb-2">Comportamento Técnico</h3>
                            <p class="text-gray-700 text-sm leading-relaxed mb-4">${comp.flow}</p>
                            <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl text-[11px] text-blue-800">
                                <b>Importante:</b> Ao medir pontes retificadoras, certifique-se de que os capacitores de filtro da placa estejam descarregados.
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-2xl border-l-8 border-slate-900 shadow-sm">
                        <h4 class="text-slate-900 font-bold mb-4 uppercase text-xs tracking-wider">Passo a Passo da Medição</h4>
                        <div class="text-gray-700 text-sm leading-relaxed space-y-2">
                            ${comp.measurement}
                        </div>
                    </div>`;
            }
        }

        const resistorColors = [
            { name: "Preto", val: 0, mult: 1, tol: null, class: "bg-preto" },
            { name: "Marrom", val: 1, mult: 10, tol: 1, class: "bg-marrom" },
            { name: "Vermelho", val: 2, mult: 100, tol: 2, class: "bg-vermelho" },
            { name: "Laranja", val: 3, mult: 1000, tol: null, class: "bg-laranja" },
            { name: "Amarelo", val: 4, mult: 10000, tol: null, class: "bg-amarelo" },
            { name: "Verde", val: 5, mult: 100000, tol: 0.5, class: "bg-verde" },
            { name: "Azul", val: 6, mult: 1000000, tol: 0.25, class: "bg-azul" },
            { name: "Violeta", val: 7, mult: 10000000, tol: 0.1, class: "bg-violeta" },
            { name: "Cinza", val: 8, mult: null, tol: 0.05, class: "bg-cinza" },
            { name: "Branco", val: 9, mult: null, tol: null, class: "bg-branco" },
            { name: "Ouro", val: null, mult: 0.1, tol: 5, class: "bg-ouro" },
            { name: "Prata", val: null, mult: 0.01, tol: 10, class: "bg-prata" }
        ];

        let selectedResistor = [1, 0, 2, 10]; 

        function renderResistorCalc() {
            const container = document.getElementById('resistor-app');
            if(!container) return;
            const val1 = resistorColors[selectedResistor[0]].val;
            const val2 = resistorColors[selectedResistor[1]].val;
            const mult = resistorColors[selectedResistor[2]].mult;
            const tol = resistorColors[selectedResistor[3]].tol;
            const finalVal = ((val1 * 10) + val2) * mult;
            let formattedVal = finalVal >= 1000000 ? (finalVal/1000000).toFixed(1) + " MΩ" : (finalVal >= 1000 ? (finalVal/1000).toFixed(1) + " kΩ" : finalVal.toFixed(0) + " Ω");

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-center p-12 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                        <div class="relative flex items-center h-20 w-80 bg-[#dec2a0] rounded-full border-4 border-[#c5a682] shadow-2xl">
                            <div class="absolute h-1.5 w-24 bg-gray-300 -left-20"></div>
                            <div class="absolute h-1.5 w-24 bg-gray-300 -right-20"></div>
                            <div class="w-6 h-full ml-12 ${resistorColors[selectedResistor[0]].class} shadow-md"></div>
                            <div class="w-6 h-full ml-6 ${resistorColors[selectedResistor[1]].class} shadow-md"></div>
                            <div class="w-6 h-full ml-6 ${resistorColors[selectedResistor[2]].class} shadow-md"></div>
                            <div class="w-6 h-full ml-16 ${resistorColors[selectedResistor[3]].class} shadow-md"></div>
                        </div>
                    </div>
                    <div class="text-center bg-blue-100 p-6 rounded-2xl shadow-inner">
                        <span class="text-5xl font-black text-blue-900">${formattedVal}</span>
                        <span class="text-2xl text-blue-700 ml-3">±${tol}%</span>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${['1ª Faixa', '2ª Faixa', 'Multiplicador', 'Tolerância'].map((label, idx) => `
                            <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 text-center">${label}</label>
                                <select onchange="updateResistor(${idx}, this.value)" class="w-full p-2 border border-gray-200 rounded-lg text-xs bg-gray-50">
                                    ${resistorColors.map((c, cIdx) => {
                                        if(idx < 2 && c.val === null) return '';
                                        if(idx === 2 && c.mult === null) return '';
                                        if(idx === 3 && c.tol === null) return '';
                                        return '<option value="' + cIdx + '" ' + (selectedResistor[idx] == cIdx ? 'selected' : '') + '>' + c.name + '</option>';
                                    }).join('')}
                                </select>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }

        function updateResistor(pos, val) {
            selectedResistor[pos] = parseInt(val);
            renderResistorCalc();
        }

        window.onload = () => showComp('transistor');
    </script>
</body>
</html>
